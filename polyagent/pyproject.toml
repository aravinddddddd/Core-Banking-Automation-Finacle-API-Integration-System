[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyagent"
version = "0.1.0"
description = "One tool-using agent loop that runs on Claude, OpenAI-compatible APIs, or a local Ollama model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "tool-use", "claude", "anthropic", "openai", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# The core package and the OpenAI-compatible and Ollama adapters run on the
# standard library alone; only the Claude adapter needs a third-party SDK.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["anthropic>=0.40", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
polyagent = "polyagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polyagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["polyagent"]
